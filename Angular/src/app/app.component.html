<div class="default-style">
  <dx-data-grid
    id="gridContainer"
    [dataSource]="orders"
    [showBorders]="true"
    (onCellPrepared)="onCellPrepared($event)"
  >
    <dxi-data-grid-column dataField="Employee" [groupIndex]="0">
    </dxi-data-grid-column>
    <dxi-data-grid-column
      dataField="OrderNumber"
      caption="Invoice Number"
      [width]="130"
    >
    </dxi-data-grid-column>
    <dxi-data-grid-column dataField="OrderDate" [width]="160" dataType="date">
    </dxi-data-grid-column>
    <dxi-data-grid-column
      dataField="CustomerStoreCity"
      caption="City"
      [groupIndex]="1"
    >
    </dxi-data-grid-column>
    <dxi-data-grid-column dataField="CustomerStoreState" caption="State">
    </dxi-data-grid-column>
    <dxi-data-grid-column
      dataField="SaleAmount"
      alignment="right"
      format="currency"
      sortOrder="desc"
    >
    </dxi-data-grid-column>
    <dxo-data-grid-group-panel [visible]="true"> </dxo-data-grid-group-panel>
    <dxo-data-grid-grouping [autoExpandAll]="true"> </dxo-data-grid-grouping>
    <dxi-data-grid-sort-by-group-summary-info summaryItem="count">
    </dxi-data-grid-sort-by-group-summary-info>
    <dxo-data-grid-summary>
      <dxi-data-grid-group-item
        column="OrderNumber"
        summaryType="count"
        displayFormat="{0} orders"
        [alignByColumn]="false"
      >
      </dxi-data-grid-group-item>
      <dxi-data-grid-group-item
        column="SaleAmount"
        summaryType="max"
        displayFormat="Max: {0}"
        valueFormat="currency"
        [alignByColumn]="true"
        [showInGroupFooter]="false"
      >
      </dxi-data-grid-group-item>
      <dxi-data-grid-group-item
        column="SaleAmount"
        summaryType="sum"
        displayFormat="Sum: {0}"
        valueFormat="currency"
        [alignByColumn]="true"
        [showInGroupFooter]="true"
      >
      </dxi-data-grid-group-item>
      <dxi-data-grid-total-item
        column="SaleAmount"
        summaryType="sum"
        displayFormat="Total Sum: {0}"
        valueFormat="currency"
      >
      </dxi-data-grid-total-item>
    </dxo-data-grid-summary>
  </dx-data-grid>
</div>
